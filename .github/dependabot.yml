# Atualizações de dependências: uma vez por mês, agrupadas por ecossistema para virar poucos pull requests.
# Versões menores e correções vêm juntas; uma versão maior vem num pull request próprio, para ser revisada à parte.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    # pyproject.toml só sobe o mínimo quando a versão nova sai da faixa; requirements-ci.txt sobe a versão fixa
    versioning-strategy: increase-if-necessary
    commit-message:
      prefix: "build(deps)"
    groups:
      python:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # O CI não instala o faster-whisper: um av novo passaria verde e quebraria a transcrição (o 19 quebra).
      # Suba o teto à mão depois de transcrever um episódio de verdade com a versão nova.
      - dependency-name: "av"
        versions: [">=19"]
      # O extra vozes foi testado na GPU com torch/torchaudio 2.5.1, pyannote.audio 3.4 e huggingface_hub 0.36
      # (docs/resultados/2026-teste-capcut-f1.md). As quatro só mudam juntas e depois de um teste real numa GPU:
      # o pyannote 4 troca use_auth_token por token, e o huggingface_hub 1.0 tira o use_auth_token que o
      # pyannote 3 usa. O CI testa o vozes só com falsos e não pegaria nada disso.
      - dependency-name: "torch"
      - dependency-name: "torchaudio"
      - dependency-name: "pyannote.audio"
      - dependency-name: "huggingface_hub"

  - package-ecosystem: npm
    directory: "/painel-web"
    schedule:
      interval: monthly
    commit-message:
      prefix: "build(painel)"
    groups:
      painel:
        patterns: ["*"]
        update-types: [minor, patch]
    ignore:
      # React 19 fica para uma rodada própria (muda a renderização e os tipos); tire daqui quando for a hora.
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
