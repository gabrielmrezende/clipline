name: testes

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Um push novo no mesmo branch cancela a rodada anterior, que já ficou velha.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: esteira e API do painel (pytest, Linux, Python ${{ matrix.python }})
    timeout-minutes: 45
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: ffmpeg (binário estático; o apt dos runners chegou a travar)
        # fixado por commit: uma tag de terceiro pode ser movida para outro código
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
      - name: "dependências (sem GPU, os testes usam falsos para Whisper, pyannote e APIs)"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: regras do canal de exemplo (a esteira lê ../Contexto)
        run: cp -r Contexto.exemplo ../Contexto
      - name: ruff
        if: matrix.python == '3.12'
        run: ruff check esteira tests scripts .claude/hooks
      - name: pytest
        run: python -m pytest -q -n auto

  windows:
    name: esteira e API do painel (pytest, Windows)
    timeout-minutes: 60
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: ffmpeg
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
      - name: dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: regras do canal de exemplo (a esteira lê ../Contexto)
        run: Copy-Item -Recurse Contexto.exemplo ../Contexto
      - name: pytest
        run: python -m pytest -q -n auto

  painel:
    name: painel (tsc, Vitest, build, Playwright)
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: painel-web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: dependências
        working-directory: painel-web
        run: npm ci
      - name: npm audit (dependências de produção; quebra a partir de "high")
        working-directory: painel-web
        run: npm audit --omit=dev --audit-level=high
      - name: tipos
        working-directory: painel-web
        run: npx tsc -b
      - name: Vitest
        working-directory: painel-web
        run: npm test
      - name: build
        working-directory: painel-web
        run: npm run build
      - name: ffmpeg
        uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
      - name: Python do painel para o e2e
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-ci.txt
          cp -r Contexto.exemplo ../Contexto
      - name: Playwright
        working-directory: painel-web
        # o Google Chrome que já vem no runner; evita baixar navegador e dependências pelo apt
        run: PLAYWRIGHT_CHROMIUM="$(command -v google-chrome)" npm run e2e
