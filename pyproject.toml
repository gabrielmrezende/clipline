[project]
name = "esteira"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faster-whisper",
    "av<18",
    "pillow",
    "opencv-python",
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12",
]

[project.optional-dependencies]
dev = ["pytest"]
vozes = ["torch==2.5.1", "torchaudio==2.5.1", "pyannote.audio>=3.1,<4", "huggingface_hub>=0.30,<1.0"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
