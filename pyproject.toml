[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "clipline"
version = "0.2.0"
description = "Esteira de cortes verticais com revisão humana: transcrição, zoom em quem fala, legenda, música, imagens e publicação."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
    "faster-whisper",
    "av<18",
    "pillow",
    "opencv-python",
    "nvidia-cublas-cu12; platform_system != 'Darwin'",
    "nvidia-cudnn-cu12; platform_system != 'Darwin'",
    "keyring",
]

[project.scripts]
clipline = "esteira.cli:principal"

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "httpx", "ruff"]
painel = ["fastapi>=0.162", "uvicorn>=0.54"]
vozes = ["torch==2.5.1", "torchaudio==2.5.1", "pyannote.audio>=3.1,<4", "huggingface_hub>=0.30,<1.0"]

[tool.setuptools.packages.find]
include = ["esteira*"]

[tool.setuptools.package-data]
"esteira.painel" = ["estatico/**/*"]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["painel-web"]

[tool.ruff.lint]
# Erros reais primeiro; estilo fica para depois, para não reescrever o projeto inteiro de uma vez.
select = ["E9", "F", "B006", "B008", "B904"]
ignore = ["F401"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
